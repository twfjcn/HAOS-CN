name: Build Home Assistant Turbo
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets to build (comma separated)'
        required: false
        default: 'rpi4_64'  # 先简化测试，只构建一个目标

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGETS="${{ github.event.inputs.targets }}"
          else
            TARGETS="rpi4_64"  # 简化测试
          fi
          JSON=$(echo "$TARGETS" | jq -R -c 'split(",")')
          echo "matrix=$JSON" >> $GITHUB_OUTPUT
    permissions:
      contents: read
      pull-requests: read
      packages: write

  build:
    needs: prepare
    runs-on: ubuntu-latest
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Echo target
        run: echo "Building for ${{ matrix.target }}"

      - name: Checkout main repo
        uses: actions/checkout@v5

      - name: Checkout private repo (修复核心)
        uses: actions/checkout@v5
        with:
          repository: desmond-dong/haos-cn-scripts
          token: ${{ secrets.GH_PAT }}
          path: private
          fetch-depth: 1
          persist-credentials: false
          ref: main  # 明确指定分支，避免默认分支检测失败
          clean: false  # 避免清空已有文件

      - name: 验证私有仓库拉取结果
        run: |
          ls -la private/  # 打印目录内容，确认拉取成功
          cat private/haos.sh || echo "haos.sh not found"  # 验证关键文件

      # 以下步骤保持不变（已简化构建目标，减少测试耗时）
      - name: Run only on main
        if: github.ref_name == 'main'
        id: get_haos_version
        run: |
          ver=$(curl -s https://api.github.com/repos/home-assistant/operating-system/releases/latest | jq -r '.tag_name')
          echo "CURRENT_VERSION=${ver}" >> $GITHUB_ENV
  
      - name: Run only on dev
        if: github.ref_name == 'dev'
        id: get_haos_version_dev
        run: |
          ver=$(curl -s https://version.home-assistant.io/dev.json | jq -r '.hassos.ova')
          echo "CURRENT_VERSION=${ver}"
          echo "CURRENT_VERSION=${ver}" >> $GITHUB_ENV
        
      - name: Initialization environment
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          chmod +x private/*.sh || echo "No scripts to chmod"
          # 暂时注释清理磁盘步骤，先聚焦解决核心问题
          # sudo private/release_space.sh
          # sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      # 后续构建步骤可暂时注释，先验证私有仓库拉取成功
