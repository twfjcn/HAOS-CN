name: Build Home Assistant Turbo
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets to build (comma separated)'
        required: false
        default: 'rpi3_64,rpi4_64,rpi5_64,ova,generic_x86_64,generic_aarch64,green,yellow,panther_x2,ihost,orangepi_cm4'

#  schedule:
#    - cron: '0 18 26 * *'
#  watch:
#    types: [started]

#env:
#  RUN_VALIDATION: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    permissions:  # 权限移到job级别（规范写法）
      contents: read
      pull-requests: read
      packages: write
    steps:
      - name: Install jq (依赖工具)
        run: sudo apt-get update && sudo apt-get install -y jq
      
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGETS="${{ github.event.inputs.targets }}"
          else
            TARGETS="rpi3_64,rpi4_64,rpi5_64,ova,generic_x86_64,generic_aarch64,green,yellow,panther_x2,ihost,orangepi_cm4"
          fi
          # 增加空值处理，避免jq解析失败
          TARGETS=${TARGETS:-"rpi3_64,rpi4_64"}
          JSON=$(echo "$TARGETS" | jq -R -c 'split(",") | map(trim) | map(select(length>0))')
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:  # 为build job添加必要权限
      contents: write
      packages: write
    steps:
      - name: Echo target
        run: echo "Building for ${{ matrix.target }}"

      # 修复：为默认checkout添加token参数
      - name: Checkout main repo
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}  # 解决token缺失问题
          fetch-depth: 0  # 可选：拉取完整历史，避免子模块问题

      # 私有仓库检出（保留原有配置）
      - name: Checkout private repo
        uses: actions/checkout@v5
        with:
          repository: desmond-dong/haos-cn-scripts
          token: ${{ secrets.GH_PAT }}
          path: private
          fetch-depth: 0

      - name: Run only on main
        if: github.ref_name == 'main'
        id: get_haos_version
        run: |
          ver=$(curl -s https://api.github.com/repos/home-assistant/operating-system/releases/latest | jq -r '.tag_name')
          echo "CURRENT_VERSION=${ver}" >> $GITHUB_ENV
  
      - name: Run only on dev
        if: github.ref_name == 'dev'
        id: get_haos_version_dev
        run: |
          ver=$(curl -s https://version.home-assistant.io/dev.json | jq -r '.hassos.ova')
          echo "CURRENT_VERSION=${ver}"
          echo "CURRENT_VERSION=${ver}" >> $GITHUB_ENV
        
      - name: Initialization environment and Free up disk space
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          chmod +x private/*.sh || echo "No scripts found in private directory"
          sudo private/release_space.sh || echo "release_space.sh not found or failed"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

      - name: Clone source code and Change Settings
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            git clone https://github.com/home-assistant/operating-system.git -b main --recurse-submodules
          else
            git clone https://github.com/home-assistant/operating-system.git --recurse-submodules
          fi
          cp -r buildroot-external operating-system || echo "buildroot-external directory not found"
          cd operating-system
          git submodule update --init --recursive  # 递归更新子模块，避免缺失

      - name: Run private build script
        run: |
          chmod +x private/*.sh || true
          private/haos.sh
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build 
        shell: 'script -q -e -c "bash {0}"'
        id: build
        run: |
          sleep $((RANDOM % 600))    
          cd operating-system || exit 1  # 增加目录检查，避免cd失败
          scripts/enter.sh make ${{ matrix.target }}

      - name: Set tag and body for release
        if: github.ref_name == 'main'
        run: |
          echo "RELEASE_TAG=${CURRENT_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_BODY=为中国地区专门加速的Home Assistant OS，不修改任何系统内的其它任何信息，所有的修改都以加速为目的。公众号：老王杂谈说，欢迎关注" >> $GITHUB_ENV

      - name: Set tag and body for dev release
        if: github.ref_name != 'main'
        run: |
          echo "RELEASE_TAG=dev-${CURRENT_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_BODY=此为开发版，请不要当正式版使用" >> $GITHUB_ENV

      - name: Upload images to release
        id: upload-release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.UPLOAD_TOKEN || github.token }}  # 兼容默认token
          file: operating-system/output/images/haos_*
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
          file_glob: true
          body: ${{ env.RELEASE_BODY }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
